name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows UCRT64 (${{ matrix.desktop }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        desktop: [ON, OFF]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ca-certificates
      - name: Build and test desktop using the README helper
        if: matrix.desktop == 'ON'
        run: python tools/build.py --build-dir build --prefix stage --test
      - name: Configure and build core
        if: matrix.desktop == 'OFF'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBRELOOP_BUILD_DESKTOP=OFF -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Test core
        if: matrix.desktop == 'OFF'
        run: ctest --test-dir build --output-on-failure --parallel 2 --timeout 180
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-logs-${{ matrix.desktop }}
          path: build/Testing/Temporary/
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure without desktop dependencies
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBRELOOP_BUILD_DESKTOP=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2 --timeout 180
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 pkg-config libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libudev-dev xvfb
      - name: Ensure Ninja is available on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v ninja >/dev/null; then brew install ninja; fi
      - name: Build and test desktop using the README helper
        run: python3 tools/build.py --build-dir build --prefix stage --test
      - name: Exercise X11 window backend
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/x11-smoke
          cd build/x11-smoke
          xvfb-run -a env SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software ../libreloop --smoke --visual-preview
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
  linux-sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure Clang with address and undefined behavior checks
        run: >-
          cmake -S . -B build -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS_DEBUG="-O1 -g"
          -DLIBRELOOP_BUILD_DESKTOP=OFF -DBUILD_TESTING=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --parallel 2 --timeout 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-sanitizer-test-logs
          path: build/Testing/Temporary/
