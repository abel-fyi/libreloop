name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb libxtst6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check Linux GUI and font rendering
        if: runner.os == 'Linux'
        run: |
          for dpi in 96 120 144 192; do
            python3 tools/check_gui.py --build build --dpi "$dpi"
          done
      - name: Check macOS bundle resources
        if: runner.os == 'macOS'
        run: |
          test -x build/LibreLoop.app/Contents/MacOS/LibreLoop
          test -f build/LibreLoop.app/Contents/Resources/fonts/LiberationSans-Regular.ttf
          test -f build/LibreLoop.app/Contents/Resources/samples/drums/Kick.wav
          test -f build/LibreLoop.app/Contents/Resources/licenses/LICENSE
          plutil -lint build/LibreLoop.app/Contents/Info.plist

  core-sanitizers:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build-core -DBUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-core --parallel 2
      - name: Test
        run: ctest --test-dir build-core --output-on-failure
